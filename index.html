<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Cell Simulator</title>
<style>
:root{--bg:#0e1a14;--fg:#eef3e6;--card:rgba(10,24,16,.82);--line:rgba(255,255,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#dfeadb;--fg:#12261a;--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.2)}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
#info{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;pointer-events:none}
#info h1{margin:0 0 4px;font-size:18px}
#info p{margin:0;font-size:14px;line-height:1.55}
#chips{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;padding:0 12px}
button{flex:none;font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--fg);color:var(--bg);font-weight:700}
</style></head><body>
<div id="info"><h1></h1><p></p></div>
<div id="chips"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO={
 all:['3D Cell Simulator · 동물세포 (Animal cell)','공룡도 우리처럼 핵이 있는 진핵세포(동물세포)로 이루어져 있었어요. 세포벽과 엽록체는 없어요. 드래그로 돌리고, 부위를 눌러 보세요.'],
 membrane:['Cell membrane · 세포막','세포를 감싸고 물질의 출입을 조절하는 얇은 막이에요.'],
 nucleus:['Nucleus & nucleolus · 핵과 인','핵에는 공룡의 DNA가 들어 있어요. 안쪽의 인에서는 리보솜 재료를 만들어요.'],
 mito:['Mitochondria · 미토콘드리아','영양분으로 에너지(ATP)를 만들어요. 몸집이 큰 공룡의 활동을 뒷받침했죠.'],
 er:['Endoplasmic reticulum · 소포체','단백질과 지질을 만들고 옮기는 통로예요. 핵 주변을 감싸고 있어요.'],
 golgi:['Golgi apparatus · 골지체','만들어진 단백질을 포장해서 필요한 곳으로 내보내요.'],
 ribo:['Ribosome · 리보솜','유전 정보를 읽어 단백질을 합성하는 작은 알갱이예요.'],
 lyso:['Lysosome · 리소좀','낡은 부품과 불필요한 물질을 분해하는 청소 담당이에요.']};
const COL={membrane:0x8fd16a,nucleus:0x5b6fd6,mito:0xf08a3c,er:0xe0c34a,golgi:0xb86be0,ribo:0xf5f0d0,lyso:0xe05555};
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);C.position.z=15;
S.add(new THREE.AmbientLight(0xffffff,.65));const L=new THREE.DirectionalLight(0xffffff,.8);L.position.set(5,8,10);S.add(L);
const cell=new THREE.Group();S.add(cell);
const mats={},meshes={};
function mat(id,o){const m=new THREE.MeshPhongMaterial(Object.assign({color:COL[id],shininess:60},o));mats[id]=m;return m}
function add(id,geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.userData.id=id;cell.add(o);(meshes[id]=meshes[id]||[]).push(o);return o}
const rnd=(a,b)=>a+Math.random()*(b-a);
const memb=add('membrane',new THREE.SphereGeometry(5,48,32),mat('membrane',{transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}),0,0,0);
const nm=mat('nucleus',{transparent:true,opacity:.7});
add('nucleus',new THREE.SphereGeometry(1.6,32,24),nm,.3,.2,0);
add('nucleus',new THREE.SphereGeometry(.55,24,16),nm,.6,.4,.3).material=new THREE.MeshPhongMaterial({color:0xd65b8a});
meshes.nucleus[1].userData.id='nucleus';
const er=add('er',new THREE.TorusKnotGeometry(1,.14,120,8,2,3),mat('er'),.3,.2,0);er.scale.setScalar(2);
const gm=mat('golgi');for(let i=0;i<5;i++){const g=add('golgi',new THREE.TorusGeometry(1.1-i*.05,.12,10,32),gm,-2.8,-1.5+i*.28,1.6);g.rotation.x=Math.PI/2}
const mm=mat('mito'),mg=new THREE.SphereGeometry(.45,16,12);
for(let i=0;i<7;i++){const a=rnd(0,6.28),b=rnd(-1.2,1.2),r=rnd(2.8,3.9);const o=add('mito',mg,mm,Math.cos(a)*r,b*1.8,Math.sin(a)*r);o.scale.set(2.1,.9,.9);o.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3))}
const lm=mat('lyso'),lg=new THREE.SphereGeometry(.33,16,12);
for(let i=0;i<6;i++){const a=rnd(0,6.28),r=rnd(3,4);add('lyso',lg,lm,Math.cos(a)*r,rnd(-2.5,2.5),Math.sin(a)*r)}
const rm=mat('ribo'),rg=new THREE.SphereGeometry(.09,8,6);
for(let i=0;i<110;i++){const v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(2.3,4.4));add('ribo',rg,rm,v.x,v.y,v.z)}
const info=document.getElementById('info'),chips=document.getElementById('chips');let sel='all';
function select(id){sel=id;info.querySelector('h1').textContent=INFO[id][0];info.querySelector('p').textContent=INFO[id][1];
 for(const k in mats)mats[k].emissive.setHex(id===k?0x555555:0);
 [...chips.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id))}
['all','membrane','nucleus','mito','er','golgi','ribo','lyso'].forEach(id=>{const b=document.createElement('button');b.dataset.id=id;b.textContent=id==='all'?'All · 전체':INFO[id][0].split(' · ')[0];
 b.onclick=()=>select(id);chips.appendChild(b)});
const tg=document.createElement('button');tg.textContent='Hide membrane';tg.onclick=()=>{memb.visible=!memb.visible;tg.textContent=memb.visible?'Hide membrane':'Show membrane'};chips.appendChild(tg);
select('all');
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let drag=false,moved=0,px,py,vx=.004,vy=0;
addEventListener('pointerdown',e=>{if(e.target.closest('#chips'))return;drag=true;moved=0;px=e.clientX;py=e.clientY});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);cell.rotation.y+=dx*.008;cell.rotation.x=Math.max(-1.4,Math.min(1.4,cell.rotation.x+dy*.008));vx=0});
addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(moved<6){mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,C);
 const h=ray.intersectObjects(cell.children.filter(o=>o.visible)).map(i=>i.object.userData.id);const f=h.find(x=>x!=='membrane')||h[0];if(f)select(f===sel?'all':f)}else setTimeout(()=>vx=.004,1500)});
addEventListener('wheel',e=>{C.position.z=Math.max(8,Math.min(24,C.position.z+e.deltaY*.01))});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
(function loop(){requestAnimationFrame(loop);if(!drag)cell.rotation.y+=vx;R.render(S,C)})();
</script></body></html>
